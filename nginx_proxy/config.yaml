name: "Nginx Proxy"
description: "Expose a local network HTTP web page through Home Assistant ingress"
version: "0.1.5"
slug: "nginx_proxy"
init: false
stage: "experimental"

arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

startup: services
boot: auto

ingress: true
ingress_port: 8099
panel_icon: mdi:web
panel_title: Proxy
host_network: true

options:
  target_url: "https://192.168.1.5:8006/"
  preserve_host: false
  rewrite_absolute_paths: true
  ssl_verify: false

schema:
  target_url: str
  preserve_host: bool
  rewrite_absolute_paths: bool
  ssl_verify: bool
